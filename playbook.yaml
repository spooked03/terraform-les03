---
- name: Configure Ubuntu VM
  hosts: ubuntu_vms
  become: yes

  tasks:
    - name: Set MOTD message
      copy:
        content: "{{ motd_message }}"
        dest: /etc/motd
        owner: root
        group: root
        mode: '0644'
      
    # Create /etc/app.conf using app_name from inventory
    - name: Create application configuration file
      copy:
        content: "Application = {{ app_name }}"
        dest: /etc/app.conf
        owner: root
        group: root
        mode: '0644'
    
    # Execute uname -r and register output in kernel_version variable
    - name: Get kernel version
      command: uname -r
      register: kernel_version
      changed_when: false
    
    # Write kernel_version.stdout to /tmp/kernel.txt
    - name: Write kernel version to file
      copy:
        content: "{{ kernel_version.stdout }}"
        dest: /tmp/kernel.txt
        owner: root
        group: root
        mode: '0644'
    
    - name: Write distribution name to facts file
      copy:
        content: "{{ ansible_distribution }}"
        dest: /tmp/facts.txt
        owner: root
        group: root
        mode: '0644'

    - name: Task only runs on Ubuntu
      debug:
        msg: "Task runs only on Ubuntu"
      when: ansible_distribution == "Ubuntu"
    
    - name: Task only runs on Red Hat
      debug:
        msg: "Task runs only on Red Hat"
      when: ansible_distribution == "RedHat" or ansible_distribution == "Red Hat Enterprise Linux"
    
    - name: Check if /etc/hosts exists
      stat:
        path: /etc/hosts
      register: hosts_file_stat
      failed_when: not hosts_file_stat.stat.exists
    
    - name: Echo hello without showing as changed
      command: echo "hallo"
      changed_when: false

